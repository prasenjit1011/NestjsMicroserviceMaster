<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .calculator-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .calculator-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .calculator-header h1 {
            color: #333;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e1e1;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .calculate-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
        }

        .result {
            background: #f8f9fa;
            padding: 1.5rem;
            margin-top: 1.5rem;
            border-radius: 5px;
            border-left: 4px solid #28a745;
        }

        .result h3 {
            color: #28a745;
            margin-bottom: 0.5rem;
        }

        .result p {
            color: #333;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 5px;
            margin-top: 1rem;
            border-left: 4px solid #c33;
        }

        .operation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            .operation-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧮 Web Calculator</h1>
        <p>Perform calculations with ease</p>
    </div>

    <div class="user-info">
        <span>Welcome, {{ username }}!</span>
        <a href="/ui_calculator" style="background: linear-gradient(135deg, #28a745, #20c997); color: white; padding: 0.5rem 1rem; border-radius: 20px; text-decoration: none; font-weight: 600; margin-right: 1rem;">🧮 UI Calculator</a>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

    <div class="calculator-container">
        <div class="calculator-header">
            <h1>Calculator</h1>
        </div>

        <form method="POST" action="/calculate">
            <div class="operation-grid">
                <div class="form-group">
                    <label for="num1">First Number:</label>
                    <input type="number" id="num1" name="num1" step="any" required
                           value="{{ request.form.num1 if request.form.num1 }}"
                           placeholder="Enter first number">
                </div>

                <div class="form-group">
                    <label for="num2">Second Number:</label>
                    <input type="number" id="num2" name="num2" step="any" required
                           value="{{ request.form.num2 if request.form.num2 }}"
                           placeholder="Enter second number">
                </div>
            </div>

            <div class="form-group">
                <label for="operation">Operation:</label>
                <select id="operation" name="operation" required>
                    <option value="">Select an operation</option>
                    <option value="add" {% if request.form.operation == 'add' %}selected{% endif %}>Addition (+)</option>
                    <option value="subtract" {% if request.form.operation == 'subtract' %}selected{% endif %}>Subtraction (-)</option>
                    <option value="multiply" {% if request.form.operation == 'multiply' %}selected{% endif %}>Multiplication (×)</option>
                    <option value="divide" {% if request.form.operation == 'divide' %}selected{% endif %}>Division (÷)</option>
                    <option value="modulo" {% if request.form.operation == 'modulo' %}selected{% endif %}>Modulo (%)</option>
                    <option value="power" {% if request.form.operation == 'power' %}selected{% endif %}>Power (^)</option>
                </select>
            </div>

            <button type="submit" class="calculate-btn">Calculate</button>
        </form>

        {% if result is defined %}
        <div class="result">
            <h3>Result:</h3>
            <p>{{ operation_display }} = {{ result }}</p>
        </div>
        {% endif %}

        {% if error %}
        <div class="error">
            <strong>Error:</strong> {{ error }}
        </div>
        {% endif %}
    </div>
</body>
</html>
