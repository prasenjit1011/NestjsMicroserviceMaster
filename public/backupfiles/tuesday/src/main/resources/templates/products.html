<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Spring Boot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }
        .banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 2rem;
        }
        .product-card {
            border-radius: 15px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            margin-bottom: 2rem;
            background: white;
            transition: box-shadow 0.2s;
        }
        .product-card:hover {
            box-shadow: 0 8px 32px rgba(102,126,234,0.15);
        }
        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .btn-order {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="banner">
            <h1>Welcome to Our Products!</h1>
            <p>Discover our exclusive selection of 10 custom products. Click any product to order!</p>
        </div>
        <div class="row">
            <div th:each="product : ${products}" class="col-md-4">
                <div class="product-card">
                    <img th:src="${product.imageUrl}" class="product-img" alt="Product Image">
                    <div class="p-3">
                        <h4 th:text="${product.name}"></h4>
                        <p th:text="${product.description}"></p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold" th:text="${product.price}"></span>
                            <button class="btn btn-order" th:onclick="'confirmOrder(\'' + ${product.id} + '\')'">Order</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function confirmOrder(productId) {
            if (confirm('Do you want to order this product?')) {
                window.location.href = '/order/confirm?productId=' + productId;
            }
        }
    </script>
</body>
</html>
