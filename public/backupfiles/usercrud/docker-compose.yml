version: '3.8'

services:
  node-api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./npm-cache:/root/.npm       # Persist npm cache
      - .:/app                       # Mount source code for hot reload
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=mydb
    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  npm-cache:
  postgres-data:













