version: "3.8"

services:
  nodeapp:
    build: .
    container_name: productcrud
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=mydb
      - DB_HOST=postgres-db   # 👈 container name of your running Postgres
      - DB_PORT=5432
    volumes:
      - .:/app
      # - /app/node_modules
    networks:
      - my-net   # 👈 must match the network your postgres container is in

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://postgres-db:5432/sonarqube
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonarpass
    networks:
      - my-net
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

networks:
  my-net:
    external: true

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:



