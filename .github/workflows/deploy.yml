name: Deploy NestJS to Cloud Run

on:
  push:
    branches:
      - grpc_apigateway

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: terraform-497011
      REGION: asia-south1
      SERVICE: api-gateway
      REPOSITORY: nestjs-repo
      IMAGE: asia-south1-docker.pkg.dev/terraform-497011/nestjs-repo/nestjs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: |
          npm run build

          echo "===== Exit Code ====="
          echo $?

          echo "===== Root ====="
          ls -la

          echo "===== dist ====="
          ls -la dist || true

          echo "===== Nest CLI ====="
          npx nest info

      - name: Verify Docker Image
        run: |
          docker run --rm $IMAGE:${{ github.sha }} sh -c '
            echo "===== WORKDIR ====="
            pwd

            echo
            echo "===== ROOT ====="
            ls -lah

            echo
            echo "===== DIST ====="
            find /app/dist -type f | sort || true

            echo
            echo "===== MAIN ====="
            find /app/dist -name main.js || true

            echo
            echo "===== PROTO ====="
            find /app/dist -name "*.proto" || true
          '
      - name: Build Docker Image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t $IMAGE:${{ github.sha }} .

      - name: Verify Docker Image
        run: |
          docker run --rm $IMAGE:${{ github.sha }} sh -c "
            echo '===== DIST =====';
            find /app/dist -type f;

            echo '===== PROTO =====';
            ls -lah /app/dist/proto || true;

            echo '===== ITEM PROTO =====';
            test -f /app/dist/proto/item.proto;
          "

      - name: Push Docker Image
        run: |
          docker push $IMAGE:${{ github.sha }}

      - name: Verify Artifact Image
        run: |
          gcloud artifacts docker images describe $IMAGE:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        continue-on-error: true
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --service-account cloudrun@terraform-497011.iam.gserviceaccount.com \
            --set-env-vars NODE_ENV=production \
            --set-env-vars JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --set-env-vars ITEM_GRPC_URL=item-service-334684044157.asia-south1.run.app:443 \
            --set-env-vars ORDER_GRPC_URL=order-service-334684044157.asia-south1.run.app:443

      - name: Show Cloud Run Logs
        if: always()
        run: |
          echo "========================================"
          echo "Cloud Run Revision Logs"
          echo "========================================"

          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="api-gateway"' \
            --limit=200 \
            --freshness=30m \
            --order=desc \
            --format="table(timestamp,severity,textPayload)"

      - name: Get Service URL
        if: success()
        run: |
          URL=$(gcloud run services describe $SERVICE \
            --region=$REGION \
            --format="value(status.url)")

          echo "SERVICE_URL=$URL" >> $GITHUB_ENV

          echo "========================================"
          echo "Service URL"
          echo "$URL"
          echo "========================================"

      - name: Test API Gateway
        if: success()
        run: |
          echo "Waiting 20 seconds..."
          sleep 20

          echo
          echo "===== GET / ====="
          curl -i "$SERVICE_URL" || true

          echo
          echo "===== GET /orders ====="
          curl -i "$SERVICE_URL/orders" || true

          echo
          echo "===== GET /items ====="
          curl -i "$SERVICE_URL/items" || true

          echo
          echo "===== GET /swagger ====="
          curl -i "$SERVICE_URL/swagger" || true