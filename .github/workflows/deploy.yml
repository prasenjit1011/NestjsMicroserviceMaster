name: Deploy to AWS Lambda using Serverless

on:
  push:
    branches:
      - doctor_test
      - multi_tenant_app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Dependencies
        run: npm ci

      - name: Install Serverless Framework v3
        run: npm install -g serverless@3

      - name: Build Project
        run: npm run build

      # =========================
      # Deploy doctor branch
      # =========================
      - name: Deploy Doctor Lambda
        if: github.ref == 'refs/heads/doctor'
        run: npx serverless deploy --stage doctor
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # =========================
      # Deploy multi_tenant_app branch
      # =========================
      - name: Deploy Multi Tenant Lambda
        if: github.ref == 'refs/heads/multi_tenant_app'
        run: npx serverless deploy --stage multi_tenant_app
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}