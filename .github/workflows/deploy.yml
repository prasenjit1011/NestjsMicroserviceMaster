name: Deploy NestJS to Cloud Run

on:
  push:
    branches:
      - ecom_item_01

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: terraform-497011
      REGION: asia-south1
      SERVICE: ecom-item-service
      REPOSITORY: nestjs-repo
      IMAGE: asia-south1-docker.pkg.dev/terraform-497011/nestjs-repo/nestjs

    steps:
      # ----------------------------------
      # Checkout
      # ----------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------
      # Authenticate Google Cloud
      # ----------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ----------------------------------
      # Setup gcloud
      # ----------------------------------
      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ----------------------------------
      # Configure Docker
      # ----------------------------------
      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # ----------------------------------
      # Setup Node.js
      # ----------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------------
      # Install Dependencies
      # ----------------------------------
      - name: Install Dependencies
        run: npm ci

      # ----------------------------------
      # Generate Prisma Client
      # ----------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # ----------------------------------
      # Build NestJS
      # ----------------------------------
      - name: Build Project
        run: |
          npm run build

          echo "===== Exit Code ====="
          echo $?

          echo "===== Root ====="
          ls -la

          echo "===== dist ====="
          ls -la dist || true

          echo "===== Nest CLI ====="
          npx nest info

      # ----------------------------------
      # Verify Build Output
      # ----------------------------------
      - name: Verify Build Output
        run: |
          echo "===== Current Directory ====="
          pwd

          echo "===== Project Root ====="
          ls -lah

          echo "===== src ====="
          ls -lah src || true

          echo "===== dist ====="
          ls -lah dist || true

          echo "===== Files inside dist ====="
          find dist -type f || true

          echo "===== Searching main.js ====="
          find . -name main.js

          if [ ! -f dist/src/main.js ]; then
            echo "ERROR: dist/src/main.js not found!"
            exit 1
          fi

      # ----------------------------------
      # Build Docker Image
      # ----------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t $IMAGE:${{ github.sha }} .

      # ----------------------------------
      # Verify Docker Image
      # ----------------------------------
      - name: Verify Docker Image
        run: |
          docker run --rm $IMAGE:${{ github.sha }} sh -c "
            echo '===== Runtime =====';
            pwd;
            ls -lah;
            echo '===== dist =====';
            ls -lah /app/dist;
            echo '===== Files =====';
            find /app/dist -type f;
            test -f /app/dist/src/main.js
          "

      # ----------------------------------
      # Push Image
      # ----------------------------------
      - name: Push Docker Image
        run: |
          docker push $IMAGE:${{ github.sha }}

      # ----------------------------------
      # Verify Artifact Registry Image
      # ----------------------------------
      - name: Verify Artifact Image
        run: |
          gcloud artifacts docker images describe $IMAGE:${{ github.sha }}

      # ----------------------------------
      # Deploy Cloud Run
      # ----------------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 50052 \
            --use-http2 \
            --service-account cloudrun@terraform-497011.iam.gserviceaccount.com \
            --set-env-vars="NEON_POSTGRE_DATABASE_URL_NEW=${{ secrets.NEON_POSTGRE_DATABASE_URL_NEW }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars="NODE_ENV=production"

      # ----------------------------------
      # Service URL
      # ----------------------------------
      - name: Get Service URL
        run: |
          gcloud run services describe $SERVICE \
            --region $REGION \
            --format="value(status.url)"