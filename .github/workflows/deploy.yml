name: Deploy NestJS to Cloud Run

on:
  push:
    branches:
      - productCrudAuthPrismaPostgresql_terraform_gcp

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: terraform-497011
      REGION: asia-south1
      SERVICE: nestjs-cloudrun
      REPOSITORY: nestjs-repo
      IMAGE: asia-south1-docker.pkg.dev/terraform-497011/nestjs-repo/nestjs

    steps:

      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------
      # Authenticate
      # ----------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ----------------------------
      # Setup gcloud
      # ----------------------------
      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ----------------------------
      # Configure Docker
      # ----------------------------
      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # ----------------------------
      # Setup Node.js
      # ----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ----------------------------
      # Install Dependencies
      # ----------------------------
      - name: Install Dependencies
        run: npm ci

      # ----------------------------
      # Generate Prisma Client
      # ----------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # ----------------------------
      # Build NestJS
      # ----------------------------
      - name: Build Project
        run: npm run build

      # ----------------------------
      # Optional Tests
      # ----------------------------
      # - name: Run Tests
      #   run: npm test

      # ----------------------------
      # Build Docker Image
      # ----------------------------
      - name: Build Docker Image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t $IMAGE:${{ github.sha }} .

      # ----------------------------
      # Push Image
      # ----------------------------
      - name: Push Docker Image
        run: |
          docker push $IMAGE:${{ github.sha }}

      # ----------------------------
      # Verify Image
      # ----------------------------
      - name: Verify Docker Image
        run: |
          gcloud artifacts docker images describe $IMAGE:${{ github.sha }}

      # ----------------------------
      # Deploy Cloud Run
      # ----------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 8080 \
            --service-account cloudrun@terraform-497011.iam.gserviceaccount.com \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --set-env-vars JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --set-env-vars NODE_ENV=production

      # ----------------------------
      # Output URL
      # ----------------------------
      - name: Get Service URL
        run: |
          gcloud run services describe $SERVICE \
            --region $REGION \
            --format="value(status.url)"