name: Deploy Spring Boot to Cloud Run

on:
  push:
    branches:
      - productCrudAuthPrismaPostgresql_terraform_gcp

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: terraform-497011
      REGION: asia-south1
      SERVICE: springboot-cloudrun
      REPOSITORY: NestjsMicroserviceMaster
      IMAGE: asia-south1-docker.pkg.dev/terraform-497011/NestjsMicroserviceMaster

    steps:
      # ----------------------------
      # Checkout code
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # Authenticate to Google Cloud
      # ----------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ----------------------------
      # Setup gcloud SDK
      # ----------------------------
      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ----------------------------
      # Configure Docker
      # ----------------------------
      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # ----------------------------
      # Setup Java
      # ----------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ----------------------------
      # Build Spring Boot App
      # ----------------------------
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # ----------------------------
      # Optional: Run Tests
      # ----------------------------
      # - name: Run Tests
      #   run: mvn test

      # ----------------------------
      # Build Docker Image
      # ----------------------------
      - name: Build Docker Image
        run: |
          docker build --no-cache --pull \
            -t $IMAGE:${{ github.sha }} .

      # ----------------------------
      # Push Docker Image
      # ----------------------------
      - name: Push Docker Image
        run: |
          docker push $IMAGE:${{ github.sha }}

      # ----------------------------
      # Verify Image
      # ----------------------------
      - name: Verify Image
        run: |
          gcloud artifacts docker images describe $IMAGE:${{ github.sha }}

      # ----------------------------
      # Deploy to Cloud Run
      # ----------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --service-account cloudrun@terraform-497011.iam.gserviceaccount.com \
            --set-env-vars DATABASE_URL="${{ secrets.NEON_DATABASE_URL }}" \
            --set-env-vars DATABASE_USERNAME="${{ secrets.NEON_DATABASE_USERNAME }}" \
            --set-env-vars DATABASE_PASSWORD="${{ secrets.NEON_DATABASE_PASSWORD }}"

      # ----------------------------
      # Get Service URL
      # ----------------------------
      - name: Get Service URL
        run: |
          gcloud run services describe $SERVICE \
            --region $REGION \
            --format="value(status.url)"