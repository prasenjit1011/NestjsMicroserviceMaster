syntax = "proto3";

package item;

service ItemService {

    rpc CreateItem(CreateItemRequest)
        returns (ItemResponse);

    rpc FindAll(Empty)
        returns (ItemList);

    rpc FindOne(ItemId)
        returns (ItemResponse);

    rpc UpdateItem(UpdateItemRequest)
        returns (ItemResponse);

    rpc DeleteItem(ItemId)
        returns (Empty);

    rpc UpdateStock(UpdateStockRequest)
        returns (StockResponse);
}

message Empty {}

message ItemId{
    int32 id=1;
}

message CreateItemRequest{
    string name=1;
    string sku=2;
    double price=3;
}

message UpdateItemRequest{
    int32 id=1;
    string name=2;
    string sku=3;
    double price=4;
}

message UpdateStockRequest{
    int32 itemId=1;
    int32 stock=2;
}

message ItemResponse{
    int32 id=1;
    string name=2;
    string sku=3;
    double price=4;
}

message StockResponse{
    int32 itemId=1;
    int32 stock=2;
}

message ItemList{
    repeated ItemResponse items=1;
}