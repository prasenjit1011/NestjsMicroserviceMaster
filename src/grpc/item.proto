syntax = "proto3";

package item;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ItemService {
  rpc CreateItem(CreateItemRequest) returns (ItemResponse);

  rpc GetItems(GetItemsRequest) returns (ItemListResponse);

  rpc GetItemById(ItemByIdRequest) returns (ItemResponse);

  rpc UpdateItem(UpdateItemRequest) returns (ItemResponse);

  rpc DeleteItem(ItemByIdRequest) returns (DeleteResponse);
}

message Item {
  int32 id = 1;

  string name = 2;

  string description = 3;

  string sku = 4;

  double price = 5;

  bool is_active = 6;

  google.protobuf.Timestamp created_at = 7;

  google.protobuf.Timestamp updated_at = 8;
}

message ItemResponse {
  bool success = 1;

  string message = 2;

  Item data = 3;
}

message ItemListResponse {
  bool success = 1;

  string message = 2;

  repeated Item data = 3;

  int64 total = 4;
}

message GetItemsRequest {
  int32 page = 1;

  int32 limit = 2;

  string search = 3;
}

message ItemByIdRequest {
  int32 id = 1;
}

message CreateItemRequest {
  string name = 1;

  string description = 2;

  string sku = 3;

  double price = 4;
}

message UpdateItemRequest {
  int32 id = 1;

  string name = 2;

  string description = 3;

  string sku = 4;

  double price = 5;

  bool is_active = 6;
}

message DeleteResponse {
  bool success = 1;

  string message = 2;
}