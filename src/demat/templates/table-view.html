<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demat Portfolio</title>
  <link rel="stylesheet" href="/css/commonstyle.css">
  <style>
    .price {
      color: #28a745;
      font-weight: 600;
    }
    .qty {
      color: #007bff;
      font-weight: 600;
    }
    .total {
      color: #dc3545;
      font-weight: 700;
      font-size: 1.1em;
    }
    .footer {
      padding: 20px;
      text-align: center;
      background: #f8f9fa;
      color: #6c757d;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Demat Portfolio</h1>
      <p>Your Stock Holdings Overview</p>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>SID</th>
          <th>Name</th>
          <th>Price (₹)</th>
          <th>API Price (₹)</th>
          <th>Quantity</th>
          <th>Total (₹)</th>
        </tr>
      </thead>
      <tbody>
        {{TABLE_ROWS}}
      </tbody>
    </table>
    <div class="footer">
      <p>Last Updated: {{TIMESTAMP}}</p>
    </div>
  </div>
</body>
</html>
