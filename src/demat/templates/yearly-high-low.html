<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yearly - {{sid}} {{stockName}} High/Low Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.8em;
            font-weight: 700;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
            font-weight: 300;
        }
        
        .info-box {
            background: linear-gradient(to right, #e3f2fd, #f3e5f5);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        
        .info-box p {
            color: #555;
            font-size: 1.1em;
            margin: 5px 0;
        }
        
        .info-box .status {
            color: #4caf50;
            font-weight: 600;
        }
        
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .year-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .year-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }
        
        .year-title {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .price-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-radius: 8px;
        }
        
        .price-row.high {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        }
        
        .price-row.low {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        }
        
        .price-label {
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .price-row.high .price-label {
            color: #155724;
        }
        
        .price-row.low .price-label {
            color: #721c24;
        }
        
        .price-value {
            font-size: 1.4em;
            font-weight: 700;
        }
        
        .price-row.high .price-value {
            color: #28a745;
        }
        
        .price-row.low .price-value {
            color: #dc3545;
        }
        
        .range-info {
            margin-top: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        
        .range-info .label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .range-info .value {
            font-size: 1.2em;
            font-weight: 600;
            color: #667eea;
        }
        
        .table-container {
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 10px;
            margin-top: 40px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 1em;
        }
        
        tbody tr {
            transition: all 0.2s ease;
        }
        
        tbody tr:hover {
            background-color: #f0f4ff;
        }
        
        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }
        
        .high-price {
            color: #28a745;
            font-weight: 600;
        }
        
        .low-price {
            color: #dc3545;
            font-weight: 600;
        }
        
        .range {
            color: #667eea;
            font-weight: 600;
        }
        
        /* Go to Top Button */
        .goto-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
            opacity: 0;
            visibility: hidden;
            z-index: 1000;
        }
        
        .goto-top.show {
            opacity: 1;
            visibility: visible;
        }
        
        .goto-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Yearly High/Low Analysis</h1>
            <p class="subtitle">{{sid}} : {{stockName}} Stock Price Analysis by Year</p>
        </div>
        <!-- Latest Price Display -->
        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 15px; margin-bottom: 30px; text-align: center; box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);">
            <h2 style="margin: 0 0 15px 0; font-size: 1.5em; color: white;">💰 Latest Stock Price</h2>
            <div style="font-size: 3em; font-weight: 700; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2);">{{latestPrice}}</div>
            <div style="font-size: 1.1em; opacity: 0.9;">As of {{latestDate}}</div>
        </div>
        
        <h2 style="color: #333; margin-bottom: 25px; font-size: 1.8em; display: flex; justify-content: space-between; align-items: center;">
            📊 Yearly High/Low Data
            <span style="font-size: 0.7em; color: #555; font-weight: normal;">
                <a href="/demat/quarterly/{{sid}}/{{stockName}}" style="color: #555; text-decoration: none;">Quarterly</a>
                | <a href="/demat/yearly/{{sid}}/{{stockName}}" style="color: #555; text-decoration: none;">Yearly</a>
                | <a href="/demat/weekly/{{sid}}/{{stockName}}" style="color: #555; text-decoration: none;">Weekly</a>
            </span>
        </h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Year</th>
                        <th>Low Price</th>
                        <th>High Price</th>
                        <th>Range</th>
                        <th>Percentage Change</th>
                    </tr>
                </thead>
                <tbody>
                    {{tableRows}}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Go to Top Button -->
    <button class="goto-top" id="gotoTopBtn" title="Go to top">↑</button>

    <script>
        // Get the button
        const gotoTopBtn = document.getElementById('gotoTopBtn');

        // Show button when user scrolls down 300px from top
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                gotoTopBtn.classList.add('show');
            } else {
                gotoTopBtn.classList.remove('show');
            }
        };

        // Scroll to top when button is clicked
        gotoTopBtn.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
