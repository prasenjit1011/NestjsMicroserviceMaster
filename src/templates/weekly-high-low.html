<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly - {{sid}} {{stockName}} Stock Data</title>
    <link rel="stylesheet" href="/css/commonstyle.css">
    <link rel="stylesheet" href="/css/weekly-high-low.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Weekly Analysis</h1>
            <p class="subtitle">{{sid}} : {{stockName}} Stock Data Analysis</p>
        </div>
        
        <h2 class="section-header">
            📊 Weekly Data
            <span class="nav-links">
                <a href="/demat">🏠</a>
                | <a href="/demat/tradelist" style="color: #555; text-decoration: none;">TradeList</a>
                | <a href="/demat/quarterly/{{sid}}/{{stockName}}" style="color: #555; text-decoration: none;">Quarterly</a>
                | <a href="/demat/yearly/{{sid}}/{{stockName}}" style="color: #555; text-decoration: none;">Yearly</a>
                | <a href="/demat/weekly/{{sid}}/{{stockName}}" style="color: #2e2ec0; text-decoration: none; font-weight: bold;">Weekly</a>
            </span>
        </h2>

        <!-- Latest Price Display -->
        <div class="latest-price-box">
            <div class="price">💰 Price : {{latestPrice}}</div>
            <div class="date">As of {{latestDate}}</div>
        </div>

        
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Timestamp</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody>
                    {{dataRows}}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Go to Top Button -->
    <button class="goto-top" id="gotoTopBtn" title="Go to top">↑</button>
    
    <!-- Go to Bottom Button -->
    <button class="goto-bottom" id="gotoBottomBtn" title="Go to bottom">↓</button>

    <script src="/js/common.js"></script>
</body>
</html>
